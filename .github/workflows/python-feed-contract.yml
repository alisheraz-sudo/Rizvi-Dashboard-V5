name: Python feed contract tests
on:
  pull_request:
    paths:
      - "connectivity_py/**"
      - "tests/test_python_feed_contract.py"
      - ".github/workflows/python-feed-contract.yml"
  push:
    branches: ["feature/python-feed-connectivity-core"]
    paths:
      - "connectivity_py/**"
      - "tests/test_python_feed_contract.py"
      - ".github/workflows/python-feed-contract.yml"
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
