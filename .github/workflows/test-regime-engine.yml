name: Python regime engine tests

on:
  push:
    branches:
      - feature/regime-adaptive-engine-v1
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python files
        run: python -m py_compile python_engine/regime_adaptive_engine.py test_regime_adaptive_engine.py
      - name: Run unit tests
        run: python -m unittest -v test_regime_adaptive_engine.py
