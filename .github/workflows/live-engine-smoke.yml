name: Live BTC engine smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - feat/stage1-20-indicator-backend-alignment

permissions:
  contents: read

jobs:
  live-btc-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch fresh BTC candles and evaluate isolated engine
        env:
          MARKET_URL: https://rizvi-dashboard-production.up.railway.app/market/btc/intraday?granularity=60
          ENGINE_URL: https://rizvi-dashboard-stability-update-production.up.railway.app/evaluate
        run: |
          python - <<'PY'
          import json, os, sys, time, urllib.request, urllib.error
          from math import isfinite
          from datetime import datetime, timezone

          def get_json(url):
              req = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "RizviDashboard-LiveSmokeTest/1.0"})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.loads(response.read().decode("utf-8"))

          def timestamp_seconds(value):
              if isinstance(value, (int, float)) and not isinstance(value, bool):
                  stamp = float(value)
                  return stamp / 1000.0 if stamp > 100_000_000_000 else stamp
              if isinstance(value, str):
                  try:
                      stamp = float(value)
                      return stamp / 1000.0 if stamp > 100_000_000_000 else stamp
                  except ValueError:
                      parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
                      if parsed.tzinfo is None:
                          parsed = parsed.replace(tzinfo=timezone.utc)
                      return parsed.timestamp()
              raise ValueError("BTC candle timestamp is missing or invalid")

          try:
              try:
                  market = get_json(os.environ["MARKET_URL"])
              except urllib.error.HTTPError as exc:
                  raise RuntimeError(f"BTC market endpoint failed: HTTP {exc.code}") from exc
              except urllib.error.URLError as exc:
                  raise RuntimeError(f"BTC market endpoint connection failed: {exc.reason}") from exc
              if not market.get("ok"):
                  raise RuntimeError("BTC market endpoint returned ok=false")
              raw = market.get("bars")
              if not isinstance(raw, list) or len(raw) < 60:
                  raise RuntimeError("BTC feed returned fewer than 60 bars")
              bars = []
              for b in raw:
                  bars.append({
                      "timestamp": b.get("t"),
                      "open": b.get("o"),
                      "high": b.get("h"),
                      "low": b.get("l"),
                      "close": b.get("c"),
                      "volume": b.get("v", 0),
                  })
              bars = [b for b in bars if all(isinstance(b.get(k), (int, float)) and isfinite(float(b[k])) for k in ("open", "high", "low", "close", "volume")) and min(b["open"], b["high"], b["low"], b["close"]) > 0 and b["volume"] >= 0 and b["high"] >= max(b["open"], b["close"], b["low"]) and b["low"] <= min(b["open"], b["close"], b["high"])]
              if len(bars) < 60:
                  raise RuntimeError("Fewer than 60 valid OHLCV candles remain after filtering")
              now = time.time()
              latest_ts = timestamp_seconds(bars[-1]["timestamp"])
              age = now - latest_ts
              if age < -60 or age > 180:
                  raise RuntimeError(f"Latest BTC candle is stale or future-dated: age={age:.1f}s")
              payload = json.dumps({"symbol": "BTCUSD", "timeframe": "1m", "bars": bars}).encode()
              req = urllib.request.Request(
                  os.environ["ENGINE_URL"], data=payload,
                  headers={"Content-Type": "application/json", "Accept": "application/json"},
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      result = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")[:500]
                  raise RuntimeError(f"Python engine endpoint failed: HTTP {exc.code}: {detail}") from exc
              except urllib.error.URLError as exc:
                  raise RuntimeError(f"Python engine endpoint connection failed: {exc.reason}") from exc
              if not result.get("ok"):
                  raise RuntimeError("Engine rejected BTC bars: " + str(result.get("reason", result.get("error", "unknown error"))))
              if result.get("autoTrading") is not False:
                  raise RuntimeError("Safety check failed: autoTrading must remain false")
              indicators = result.get("indicators")
              engines = result.get("engines")
              diagnostics = result.get("indicator_diagnostics")
              diagnostic_items = diagnostics.get("indicators") if isinstance(diagnostics, dict) else None
              master = result.get("master_engine") or result.get("engine_5")
              if not isinstance(indicators, dict) or not isinstance(engines, dict):
                  raise RuntimeError("Engine response missing indicator or specialist-engine diagnostics")
              if not isinstance(master, dict):
                  raise RuntimeError("Incompatible/legacy engine endpoint: response has no Master Engine 5 object")
              if len(engines) != 4:
                  raise RuntimeError(f"Expected four specialist engines; received {len(engines)}")
              if not isinstance(diagnostic_items, dict) or len(diagnostic_items) != 20:
                  raise RuntimeError("Expected the locked 20-indicator diagnostics roster; endpoint response is incompatible")
              print(json.dumps({
                  "status": "PASS",
                  "market_source": market.get("source"),
                  "bar_count": len(bars),
                  "latest_candle_age_seconds": round(age, 1),
                  "engine_version": result.get("version"),
                  "regime": result.get("regime"),
                  "legacy_indicator_output_count": len(indicators),
                  "locked_indicator_diagnostic_count": len(diagnostic_items),
                  "specialist_engine_count": len(engines),
                  "master_engine_present": True,
                  "signal": result.get("signal"),
                  "confidence_score_not_win_probability": result.get("confidence"),
                  "order_flow_status": result.get("order_flow_status", "not returned"),
                  "autoTrading": result.get("autoTrading"),
              }, indent=2))
          except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError, ValueError, KeyError, TypeError, RuntimeError) as exc:
              print("LIVE BTC ENGINE SMOKE TEST FAILED: " + str(exc), file=sys.stderr)
              sys.exit(1)
          PY
